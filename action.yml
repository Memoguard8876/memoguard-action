name: MemoGuard
description: Scan Stellar transaction data for accidental public disclosure
inputs:
  path:
    description: Path to a transaction XDR, simulation JSON, or decoded public JSON file
    required: true
  kind:
    description: xdr, simulation, or json
    required: false
    default: xdr
  policy:
    description: Optional JSON policy path
    required: false
    default: ''
  fail-on:
    description: Finding severity that fails the job (block, warning, or none)
    required: false
    default: block
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version-file: ${{ github.action_path }}/go.mod
    - name: Scan transaction data
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_KIND: ${{ inputs.kind }}
        INPUT_POLICY: ${{ inputs.policy }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        action_path="$GITHUB_ACTION_PATH"
        if command -v cygpath >/dev/null 2>&1; then action_path="$(cygpath -u "$action_path")"; fi
        bash "$action_path/scripts/run.sh"
