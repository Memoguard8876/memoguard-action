name: Action integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  blocked-fixture:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Scan a clean public-data fixture
        uses: ./
        with:
          path: fixtures/clean.json
          kind: json
      - name: Scan a blocked public-data fixture
        id: scan
        continue-on-error: true
        uses: ./
        with:
          path: fixtures/blocked.json
          kind: json
      - name: Scan a warning without failing
        uses: ./
        with:
          path: fixtures/warning.json
          kind: json
      - name: Fail on a warning when configured
        id: strict
        continue-on-error: true
        uses: ./
        with:
          path: fixtures/warning.json
          kind: json
          fail-on: warning
      - name: Verify blocking result
        if: always()
        shell: bash
        run: test '${{ steps.scan.outcome }}' = 'failure' && test '${{ steps.strict.outcome }}' = 'failure'
